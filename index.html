<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superhero Search</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header Section -->
        <h1 class="header-title">Avengers Character Search</h1>
        <p class="header-subtitle">Search by Full Name or Alias</p>

        <!-- Search Section -->
        <div class="search-section">
            <input type="text" id="searchInput" placeholder="e.g. Captain America or Steve Rogers">
            <button id="searchBtn">Search</button>
        </div>

        <!-- Result Section -->
        <div id="result" class="result-section">
            <h2 class="result-title">RESULT</h2>
            <div class="result-content">
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
